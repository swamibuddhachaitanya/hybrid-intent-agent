[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Swami Buddha Chaitanya", email = "chaitanya.swami04@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sentence-transformers>=6.1.0",
    "tensorflow>=2.15.0",
    "uvicorn>=0.53.0",
]

# This project is an application, not an installable library: nothing is built or
# installed from it. requirements.txt is the dependency source of truth for the
# container image, and this file covers local `uv` usage.
[tool.uv]
package = false
